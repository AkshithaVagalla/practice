name: Python Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  run-python-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run all Python files
        run: |
          find "python/Hello world" -name "*.py" -exec python "{}" \;
